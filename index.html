<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06080c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ficha Viva" />
    <meta
      name="description"
      content="Ficha Viva AAA — crie, desperte e jogue suas fichas de D&D 5e com uma experiência cinematográfica de jogo AAA."
    />
    <title>Ficha Viva AAA</title>
    <script>
      // aplica o tema e o modo (claro/escuro) salvos (ou o padrão, Véu Astral escuro) antes do app carregar: sem piscar a cor errada
      try {
        var st = JSON.parse(localStorage.getItem('fv-ui') || '{}').state || {};
        var t = st.theme || 'astral';
        var m = (st.modes || {})[t] || (t === 'eclipse' ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-mode', m);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'astral');
        document.documentElement.setAttribute('data-mode', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
